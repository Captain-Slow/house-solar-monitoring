# Development / integration-test PostgreSQL. NOT for production (see deploy/truenas/compose.yaml).
# Bound to loopback only; set DEV_DB_PORT if 55432 is taken on your machine.
# Tests use DATABASE_URL=postgresql://solar:solar@127.0.0.1:55432/solar_test
services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: solar
      POSTGRES_PASSWORD: solar
      POSTGRES_DB: solar_test
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-55432}:5432"
    command:
      - postgres
      - -c
      - tcp_keepalives_idle=30
      - -c
      - tcp_keepalives_interval=10
      - -c
      - tcp_keepalives_count=3
    volumes:
      - dev-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar -d solar_test"]
      interval: 5s
      retries: 12

volumes:
  dev-pgdata:
